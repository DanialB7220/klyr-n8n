# KLYR Agent OS — n8n + Postgres on Render
# Based on render-examples/n8n, changed for production:
#   - paid plans (free Postgres is deleted after 30 days; free web services sleep and miss webhooks)
#   - n8n version pinned (upgrade on purpose, monthly: change the tag below and commit)
#   - KLYR settings added (domain, timezone, execution pruning)
#   - both services in the same region so n8n reaches the database over Render's private network

services:
  - type: web
    # 1 CPU / 2 GB
    plan: standard
    region: virginia
    runtime: image
    name: n8n-service
    image:
      # Pinned to the stable release as of 2026-11-23. Never use :latest here.
      url: docker.io/n8nio/n8n:2.48.8

    envVars:
      # Encrypts every credential saved in n8n.
      # Do not modify this value after it's generated!
      # Copy it into the password manager as soon as the first deploy finishes.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # Database connection (filled in automatically from n8n-db below)
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user

      # Public address. Webhook URLs n8n hands out (GHL, Stripe, WhatsApp) use this.
      - key: WEBHOOK_URL
        value: https://agents.klyrmedia.com/
      - key: N8N_HOST
        value: agents.klyrmedia.com
      - key: N8N_PROTOCOL
        value: https

      # Scheduled workflows (e.g. the 7am digest) run on Eastern time
      - key: GENERIC_TIMEZONE
        value: America/New_York
      - key: TZ
        value: America/New_York

      # Keep 14 days of execution history so the database stays small
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "336"

databases:
  - name: n8n-db
    # Smallest paid Postgres plan (0.1 CPU / 256 MB). Never expires.
    plan: basic-256mb
    region: virginia
    # Storage in GB (multiples of 5). Plenty for n8n + the ops ledger to start.
    diskSizeGB: 5
